name: Database checks

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Start local Supabase stack and apply migrations
        run: supabase start

      - name: Lint public schema
        run: supabase db lint --local --schema public --fail-on error

      - name: Run database tests
        run: supabase test db --local
